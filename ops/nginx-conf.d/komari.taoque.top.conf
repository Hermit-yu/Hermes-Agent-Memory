upstream nezha-dashboard {
    server 172.17.0.1:8008;
    keepalive 512;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name komari.taoque.top;

    ssl_certificate /etc/nginx/certs/komari.taoque.top_cert.pem;
    ssl_certificate_key /etc/nginx/certs/komari.taoque.top_key.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    underscores_in_headers on;
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    keepalive_time 24h;
    keepalive_requests 100000;
    keepalive_timeout 120s;

    # gRPC - agent communication
    location ^~ /proto.NezhaService/ {
        grpc_set_header Host $host;
        grpc_set_header nz-realip $http_CF_Connecting_IP;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
        client_max_body_size 10m;
        grpc_buffer_size 4m;
        grpc_pass grpc://nezha-dashboard;
    }

    # Agent API (v2)
    location ~* ^/api/clients/ {
        proxy_pass http://nezha-dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header nz-realip $http_CF_Connecting_IP;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;
    }

    # WebSocket
    location ~* ^/api/v1/ws/(server|terminal|file)(.*)$ {
        proxy_pass http://nezha-dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin https://$host;
        proxy_set_header nz-realip $http_CF_Connecting_IP;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main dashboard
    location / {
        proxy_pass http://nezha-dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header nz-realip $http_CF_Connecting_IP;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
    }

    client_max_body_size 1000m;
}

server {
    listen 80;
    listen [::]:80;
    server_name komari.taoque.top;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
