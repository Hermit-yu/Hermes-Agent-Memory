server {
    listen 80;
    listen [::]:80;

    server_name www.taoque.top;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.taoque.top;

    ssl_certificate /etc/nginx/certs/www.taoque.top_cert.pem;
    ssl_certificate_key /etc/nginx/certs/www.taoque.top_key.pem;

    root /var/www/html/www.taoque.top/wordpress;
    index index.php;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|bmp|swf|eot|svg|ttf|woff|woff2|webp)$ {
        aio threads;
        add_header Cache-Control "public, max-age=2592000";
        log_not_found off;
        access_log off;
    }

    client_max_body_size 50m;  
}

