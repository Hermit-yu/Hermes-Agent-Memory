server {
    listen 80;
    listen [::]:80;
    server_name subs.taoque.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name subs.taoque.top;

    ssl_certificate /etc/nginx/certs/live/subs.taoque.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/subs.taoque.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态(PWA, 根相对路径资源)
    root /var/www/html/subs.taoque.top;
    index index.html;

    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # 后端接口/下载/分享 → 反代到 Sub-Store Node 后端(web_default 网关, 不露公网)
    location ~ ^/(api|download|share)/ {
        proxy_pass http://172.18.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA 静态资源(SW/manifest/图标/chunk) 直走本地
    location ~* \.(js|css|png|svg|ico|json|webmanifest|woff2?|ttf)$ {
        try_files $uri =404;
    }

    # SPA/PWA 兜底：非接口、非静态 → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
