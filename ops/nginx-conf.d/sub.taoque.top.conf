server {
    listen 80;
    listen [::]:80;
    server_name sub.taoque.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub.taoque.top;

    ssl_certificate /etc/nginx/certs/live/sub.taoque.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sub.taoque.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location / {
        set $subconv_backend subconv:8080;
        proxy_pass http://$subconv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
